spring:
  application:
    name: "fundicion-lara"
    version: "1.0.1"
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fundicion_lara_db}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:root}"
    hikari:
      maximum-pool-size: "${MAXIMUM_POOL_SIZE:10}"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    groups:
      enabled: true
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org:
      springframework: WARN
      hibernate:
        SQL: ERROR

image:
  api-key: "${IMAGE_API_KEY:daee93372ab89b87258a5c42dbf63342}"